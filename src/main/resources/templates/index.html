
<!DOCTYPE html> 
<html  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">  <!--USA LA CODIFICA PER IL TESTO-->
    <title>FESTIVAL CINEMATOGRAFICI</title>
</head>
<body>
    <h1>Festival del cinema</h1>
    <a href="/festivals">Festival</a>
    <a href="/films">Film</a>
	<a href="/sale">Sala</a>
	<a href="/proiezioni">Proiezioni</a>
	<!-- Se NON sei loggata -->
	<p th:if="${userDetails == null}">
	    <a href="/login">Accedi</a> | <a href="/register">Registrati</a>
	</p>

	<!-- Se sei loggata -->
	<div th:if="${userDetails != null}">
	    <p>Ciao, <span th:text="${userDetails.username}">utente</span></p>
	    <form th:action="@{/logout}" method="post">
	        <button type="submit">Logout</button>
	    </form>
	</div>

</body>
</html>
