<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">  <!--DICHIARAZIONE PER UTILIZZARE THYMELEAF-->
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Film</title>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main>
    <p th:if="${messaggio}" th:text="${messaggio}">Messaggio</p>
    <h1 th:text="${filtroRegista != null} ? 'Film di ' + ${filtroRegista} : (${filtroGenere != null} ? 'Genere: ' + ${filtroGenere} : 'Film')">Film</h1>

    <ul>   <!--LISTA PUNTATA-->
        <li th:each="film : ${films}">    <!--ripete (e tutto quello che ha dentro) una volta per ogni elemento della lista festivals, e in ogni giro chiama l’elemento corrente festival-->
            <a th:href="@{/films/{id} (id=${film.id}) }"   
               th:text="${film.titolo}">Titolo</a>
            - <a th:href="@{/films(regista=${film.regista})}" th:text="${film.regista}">Regista</a>
            (<span th:text="${film.anno}">2000</span>)
        </li>
    </ul>
    <a href="/">Home</a>
</main>
</body>
</html>
