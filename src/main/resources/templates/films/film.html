<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dettaglio film</title>
</head>
<body>
    <p th:if="${messaggio}" th:text="${messaggio}">Messaggio</p>
    <div th:object="${film}">
        <h1 th:text="*{titolo}">Titolo</h1>
        <p>Regia di <span th:text="*{regista}">Regista</span></p>
        <p><span th:text="*{anno}">2000</span> - <span th:text="*{durata}">100</span> min</p>
        <p><span th:text="*{genere}">Genere</span> - <span th:text="*{paeseProduzione}">Paese</span></p>

        <h2>Festival</h2>
        <ul>
            <li th:each="f : *{festival}">
                <a th:href="@{/festivals/{id}(id=${f.id})}" th:text="${f.nome}">Festival</a>
            </li>
        </ul>
    </div>
    <a href="/films">Torna all'elenco</a>
</body>
</html>
