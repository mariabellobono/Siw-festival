<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Dettaglio festival</title>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main>
    <p th:if="${messaggio}" th:text="${messaggio}">Messaggio</p>
    <div th:object="${festival}">
        <img class="simbolo-grande" th:src="@{${festival.percorsoImmagine}}" alt="">
        <h1 th:text="*{nome}">Nome</h1>
        <p><span th:text="*{citta}">Città</span>, <span th:text="*{anno}">2025</span></p>
        <p>Dal <span th:text="*{dataInizio}">data</span> al <span th:text="*{dataFine}">data</span></p>
        <p th:text="*{descrizione}">Descrizione</p>

        <h2>Film</h2>
        <ul>
            <li th:each="film : *{films}">
                <a th:href="@{/films/{id}(id=${film.id})}" th:text="${film.titolo} + ' (' + ${film.anno} + ')'">Titolo</a>
            </li>
        </ul>

        <h2>Programma delle proiezioni</h2>
        <p th:if="${#lists.isEmpty(festival.proiezioni)}">Nessuna proiezione programmata.</p>
        <ul>
            <li th:each="p : *{proiezioni}">
                <a th:href="@{/proiezioni/{id}(id=${p.id})}"
                   th:text="${p.data} + ' ' + ${p.ora} + ' - ' + ${p.film.titolo} + ' - ' + ${p.sala.nome}">Proiezione</a>
                <span class="stato" th:classappend="'stato-' + ${p.stato}" th:text="${p.stato}">stato</span>
            </li>
        </ul>
    </div>
    <p th:if="${isAdmin}"><a th:href="@{/admin/festivals/{id}/films(id=${festival.id})}">Gestisci film del festival</a></p>
    <div th:if="${isAdmin}" class="azioni">
        <a th:href="@{/admin/festivals/{id}/edit(id=${festival.id})}">Modifica festival</a>
        <form th:action="@{/admin/festivals/{id}/elimina(id=${festival.id})}" method="post"
              onsubmit="return confirm('Eliminare il festival? Si puo\' eliminare solo se non ha film né proiezioni.')">
            <button type="submit">Elimina festival</button>
        </form>
    </div>
    <a href="/festivals">Torna all'elenco</a>
</main>
</body>
</html>
