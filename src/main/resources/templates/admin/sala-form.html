<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Sala</title>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main>
    <h1 th:text="${sala.id != null} ? 'Modifica sala' : 'Nuova sala'">Nuova sala</h1>

    <form th:action="${sala.id != null} ? @{/admin/sale/{id}(id=${sala.id})} : @{/admin/sale}" th:object="${sala}" method="post">

        <div>
            <label>Nome <input type="text" th:field="*{nome}"></label>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">errore</span>
        </div>

        <div>
            <label>Indirizzo <input type="text" th:field="*{indirizzo}"></label>
            <span th:if="${#fields.hasErrors('indirizzo')}" th:errors="*{indirizzo}">errore</span>
        </div>

        <div>
            <label>Capienza <input type="number" th:field="*{capienza}"></label>
            <span th:if="${#fields.hasErrors('capienza')}" th:errors="*{capienza}">errore</span>
        </div>

        <button type="submit">Salva</button>
    </form>

    <p><a th:href="@{/}">Torna alla Home</a></p>
</main>
</body>
</html>
