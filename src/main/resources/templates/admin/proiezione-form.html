<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Programma proiezione</title>
</head>
<body>
    <h1 th:text="${proiezioneId != null} ? 'Modifica proiezione' : 'Programma una proiezione'">Programma una proiezione</h1>

    <form th:action="${proiezioneId != null} ? @{/admin/proiezioni/{id}(id=${proiezioneId})} : @{/admin/proiezioni}" th:object="${proiezioneForm}" method="post">

        <!-- Errori generali (non legati a un campo): sala occupata, film non nel festival, ecc. -->
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}">errore</p>
        </div>

        <div>
            <label>Festival
                <select th:field="*{festivalId}">
                    <option value="">-- scegli un festival --</option>
                    <option th:each="f : ${festivals}" th:value="${f.id}" th:text="${f.nome + ' ' + f.anno}">Festival</option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('festivalId')}" th:errors="*{festivalId}">errore</span>
        </div>

        <div>
            <label>Film
                <select th:field="*{filmId}">
                    <option value="">-- scegli un film --</option>
                    <option th:each="f : ${films}" th:value="${f.id}" th:text="${f.titolo + ' (' + f.anno + ')'}">Film</option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('filmId')}" th:errors="*{filmId}">errore</span>
        </div>

        <div>
            <label>Sala
                <select th:field="*{salaId}">
                    <option value="">-- scegli una sala --</option>
                    <option th:each="s : ${sale}" th:value="${s.id}" th:text="${s.nome}">Sala</option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('salaId')}" th:errors="*{salaId}">errore</span>
        </div>

        <div>
            <label>Data <input type="date" th:field="*{data}"></label>
            <span th:if="${#fields.hasErrors('data')}" th:errors="*{data}">errore</span>
        </div>

        <div>
            <label>Ora <input type="time" th:field="*{ora}"></label>
            <span th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}">errore</span>
        </div>

        <button type="submit">Salva</button>
    </form>

    <p><a th:href="@{/}">Torna alla Home</a></p>
</body>
</html>
